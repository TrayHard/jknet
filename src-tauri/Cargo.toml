[package]
name = "jknet"
version = "0.6.0"
description = "Launcher for Star Wars Jedi Knight: Jedi Academy and Jedi Outcast"
authors = ["JKNet"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jknet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3.27.0"
# `protocol-asset` registers the `asset:` handler the map pictures are served
# through. Its scope is `app.security.assetProtocol` plus the folder
# `levelshots::allow_cache_folder` adds at startup.
#
# --- slice: chat notifications ---
# `tray-icon` for the icon in the notification area: the menu, the unread
# badge (drawn over the window icon in `tray.rs`, so no image decoder is
# needed) and the way back into a launcher whose window was closed to it.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
log = "0.4.34"
tauri-plugin-log = "2.9.1"
tauri-plugin-dialog = "2.7.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha1 = "0.11.0"
sha2 = "0.10.9"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "stream", "http2", "cookies"] }
rustls = { version = "0.23.44", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio = { version = "1.53.1", features = ["net", "time", "sync", "rt", "macros", "fs", "io-util"] }
tauri-plugin-process = "2.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tga", "bmp"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
scraper = { version = "0.27.0", default-features = false, features = ["main", "errors"] }
percent-encoding = "2.3.2"
sevenz-rust2 = { version = "0.22.2", default-features = false }
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2"
# The single-byte code pages of the `strings/<language>/*.str` files of the
# game, see `file_preview_contents::encoding_of`.
encoding_rs = "0.8"
# Pictures of a previewed archive travel to the webview as data URLs.
base64 = "0.22"
# --- slice: play with friends ---
# The signature of every message between the tunnel of a private server and
# the relay node, over the `sha2` above.
hmac = "0.12"
# Passwords, the rcon password and the session label of a private server.
getrandom = "0.3"
# --- slice: chat notifications ---
# Quiet hours are hours of the player's own clock: the local time zone, which
# the standard library does not read. The version Tauri already pulls in.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2.4.1"
# --- slice: chat notifications ---
# A second start of the launcher raises the first one instead of opening a
# second window over the same data folder, and the launcher can start with
# Windows, hidden in the tray. Both are called from Rust only.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target."cfg(windows)".dependencies]
# NTFS directory junctions for the base root of a Jedi Outcast client, see
# `launch::prepare_basepath`. Pure Win32: it writes the reparse point through
# `FSCTL_SET_REPARSE_POINT` itself, so no `mklink` subprocess and no elevation.
# `default-features = false` drops `unstable_admin`, which only turns on doc
# tests that read `C:\Users\Default User`.
junction = { version = "2.0.0", default-features = false }
winreg = "0.56.0"
# --- slice: play with friends ---
# The dedicated server of a private server runs under a pseudo console inside
# a Job Object, and the local network addresses come from
# `GetAdaptersAddresses`. The same version `junction` and Tauri already pull in.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # --- slice: chat notifications --- `PlaySoundW` for the chat sounds.
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
# --- slice: chat notifications ---
# Windows notifications of chat messages, with the click that opens the
# conversation. The crate directly rather than `tauri-plugin-notification`,
# which offers no click handler on the desktop. 0.7 shares the `windows`
# crate version Tauri already builds.
tauri-winrt-notification = "0.7"

[dev-dependencies]
