[package]
name = "jknet"
version = "0.1.1"
description = "Launcher for Star Wars Jedi Knight: Jedi Academy multiplayer"
authors = ["JKNet"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jknet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` registers the `asset:` handler the map pictures are served
# through. Its scope is `app.security.assetProtocol` plus the folder
# `levelshots::allow_cache_folder` adds at startup.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
log = "0.4.34"
tauri-plugin-log = "2.9.1"
tauri-plugin-dialog = "2.7.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha1 = "0.11.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "stream", "http2"] }
tokio = { version = "1.53.1", features = ["net", "time", "sync", "rt", "macros", "fs", "io-util"] }
tauri-plugin-process = "2.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tga"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2.4.1"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
